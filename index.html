<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스킨케어 로그</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,700;1,9..40,700&family=Noto+Sans+KR:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F6F2E9;
    --paper: #FFFFFF;
    --ink: #201C16;
    --ink-soft: #8A7F70;
    --line: #E1D8C6;

    --am-bg: #F7E7C6;
    --am-bg-soft: #FBF1DE;
    --am-ink: #7A4A0E;
    --am-solid: #C1791A;

    --pm-bg: #17251D;
    --pm-bg-soft: #1E2F24;
    --pm-text: #E7EEE6;
    --pm-dim: #93A798;

    --tag-pink: #A8465A;
    --tag-red: #9C4A2E;
    --tag-gray: #756B5C;
    --tag-purple: #6C5A9E;

    --radius: 6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);}
  body{
    font-family:'Noto Sans KR','DM Sans',-apple-system,sans-serif;
    font-weight:700;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}

  .wrap{max-width:1080px;margin:0 auto;padding:32px 20px 70px;}

  .masthead{
    display:flex;justify-content:space-between;align-items:flex-end;
    flex-wrap:wrap;gap:14px;
    padding-bottom:18px;margin-bottom:4px;
    border-bottom:2px solid var(--ink);
  }
  .brand{
    font-family:'Noto Sans KR','DM Sans',sans-serif;font-weight:700;
    font-size:32px;letter-spacing:-0.01em;
  }
  .legend{
    display:flex;gap:16px;font-size:11px;
    color:var(--ink-soft);align-items:center;
  }
  .legend .mono{font-size:10px;letter-spacing:.03em;}
  .swatch{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .dot.am{background:var(--am-solid);}
  .dot.pm{background:var(--pm-bg-soft);border:1.5px solid var(--pm-dim);}

  .toolbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0 16px;flex-wrap:wrap;gap:10px;
  }
  .range{font-size:12px;color:var(--ink-soft);}
  .range .mono{color:var(--ink);}
  .refresh-btn{
    border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
    letter-spacing:.04em;text-transform:uppercase;
    padding:7px 14px;border-radius:3px;cursor:pointer;
    transition:background .12s ease,color .12s ease;
  }
  .refresh-btn:hover{background:var(--ink);color:var(--bg);}
  .refresh-btn:disabled{opacity:.4;cursor:default;background:var(--paper);color:var(--ink);}
  .status{font-size:11px;color:var(--ink-soft);margin:0 0 14px;min-height:14px;font-family:'IBM Plex Mono',monospace;}
  .status.error{color:var(--tag-red);}

  .weekday-row{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:1px;background:var(--line);}
  .weekday{
    text-align:center;font-size:10px;font-weight:600;letter-spacing:.1em;
    color:var(--ink-soft);text-transform:uppercase;padding:6px 0;background:var(--bg);
    font-family:'IBM Plex Mono',monospace;
  }
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);margin-bottom:1px;}

  .day{
    background:var(--paper);
    display:flex;flex-direction:column;
    min-height:190px;cursor:pointer;position:relative;
    transition:outline .1s ease;
  }
  .day:hover{outline:2px solid var(--ink);outline-offset:-2px;z-index:2;}
  .day.today{box-shadow:inset 0 0 0 2px var(--am-solid);}
  .day.empty .half{opacity:.42;}

  .date-num{
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
    padding:5px 7px 3px;color:var(--ink-soft);
    display:flex;justify-content:space-between;
  }
  .day.today .date-num{color:var(--am-ink);}

  .half{padding:4px 7px 7px;flex:1;display:flex;flex-direction:column;gap:3px;min-height:0;}
  .am{background:var(--am-bg-soft);}
  .pm{background:var(--pm-bg);color:var(--pm-text);}
  .rule{height:1px;background:var(--ink);opacity:.15;position:relative;}
  .rule::before{
    content:'';position:absolute;left:6px;top:-2px;width:4px;height:4px;
    border-radius:50%;background:var(--ink);opacity:.5;
  }

  .half-label{
    font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:600;
    letter-spacing:.1em;opacity:.5;text-transform:uppercase;
  }
  .tags{display:flex;flex-wrap:wrap;gap:3px;}
  .tag{
    font-size:9px;font-family:'IBM Plex Mono',monospace;font-weight:600;
    padding:1px 4px;border:1px solid currentColor;border-radius:2px;
    color:var(--tag-gray);
  }
  .tag.pink{color:var(--tag-pink);}
  .tag.red{color:var(--tag-red);}
  .tag.gray{color:var(--tag-gray);}
  .pm .tag{color:var(--pm-dim);border-color:var(--pm-dim);}
  .pm .tag.purple{color:#B3A6E0;border-color:#B3A6E0;}

  .products{font-size:10.5px;line-height:1.45;color:var(--ink);}
  .pm .products{color:var(--pm-text);}
  .empty-hint{font-size:10px;color:var(--ink-soft);}
  .pm .empty-hint{color:var(--pm-dim);}

  /* modal */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(20,17,12,.5);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--paper);border-radius:4px;max-width:420px;width:100%;
    max-height:82vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.3);
    border:1px solid var(--line);
  }
  .modal-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 20px;border-bottom:2px solid var(--ink);
  }
  .modal-date{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:19px;}
  .modal-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);}
  .close-x{background:none;border:none;font-size:16px;cursor:pointer;color:var(--ink-soft);}
  .modal-section{padding:16px 20px;border-bottom:1px solid var(--line);}
  .modal-section:last-child{border-bottom:none;}
  .modal-section.pm{background:var(--pm-bg);color:var(--pm-text);}
  .modal-section-title{
    font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin-bottom:10px;
  }
  .modal-row{font-size:13px;margin-bottom:8px;line-height:1.5;}
  .modal-row b{
    font-family:'IBM Plex Mono',monospace;font-weight:600;opacity:.55;
    font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
    display:block;margin-bottom:3px;
  }

  @media (max-width:640px){
    .wrap{padding:20px 10px 50px;}
    .brand{font-size:24px;}
    .day{min-height:160px;}
    .products{font-size:9px;}
    .tag{font-size:8px;}
    .legend{display:none;}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="brand">스킨케어 로그</div>
    <div class="legend">
      <span class="swatch"><span class="dot am"></span><span class="mono">AM · 앰버</span></span>
      <span class="swatch"><span class="dot pm"></span><span class="mono">PM · 다크글라스</span></span>
    </div>
  </div>
  <div class="toolbar">
    <div class="range mono" id="rangeLabel">—</div>
    <button class="refresh-btn" id="refreshBtn">Refresh</button>
  </div>
  <div class="status" id="status"></div>
  <div class="weekday-row" id="weekdayRow"></div>
  <div id="calendar"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal"></div>
</div>

<script>
const WEEKDAYS = ["일","월","화","수","목","금","토"];

function pad(n){ return String(n).padStart(2,"0"); }
function toISODate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }

function getMondayOfWeek(d){
  const day = d.getDay();
  const diff = (day===0? -6 : 1) - day;
  const monday = new Date(d);
  monday.setDate(d.getDate()+diff);
  monday.setHours(0,0,0,0);
  return monday;
}

function buildRange(){
  const today = new Date();
  const thisMonday = getMondayOfWeek(today);
  const start = new Date(thisMonday); start.setDate(thisMonday.getDate()-7);
  const end = new Date(thisMonday); end.setDate(thisMonday.getDate()+13);
  const days = [];
  for(let i=0;i<21;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    days.push(d);
  }
  return {start, end, days, today};
}

let STATE = { data: {}, days: [] };

function setStatus(msg, isError){
  const el = document.getElementById('status');
  el.textContent = msg || '';
  el.className = 'status' + (isError ? ' error' : '');
}

function renderWeekdayRow(){
  const row = document.getElementById('weekdayRow');
  row.innerHTML = WEEKDAYS.slice(1).concat(WEEKDAYS[0]).map(w=>`<div class="weekday">${w}</div>`).join('');
}

function tagClass(name){
  if(name.includes('코') || name.includes('모공')) return 'pink';
  if(name.includes('볼') || name.includes('흔적')) return 'red';
  if(name.includes('이마')) return 'gray';
  if(['레티놀','비타민C','AHA/BHA','기타 액티브'].includes(name)) return 'purple';
  return '';
}

function renderTags(list){
  if(!list || !list.length) return '';
  return `<div class="tags">${list.map(t=>`<span class="tag ${tagClass(t)}">${t}</span>`).join('')}</div>`;
}

function dayCellHTML(d, entry){
  const iso = toISODate(d);
  const isToday = iso === toISODate(STATE.days.today);
  const hasData = !!entry;
  const morning = entry?.morning || {};
  const night = entry?.night || {};
  const amProducts = (morning.products||[]).slice(0,2).join(' · ');
  const pmProducts = (night.products||[]).slice(0,2).join(' · ');

  return `
  <div class="day ${isToday?'today':''} ${hasData?'':'empty'}" data-date="${iso}">
    <div class="date-num"><span>${d.getDate()}</span></div>
    <div class="half am">
      <div class="half-label">AM</div>
      ${renderTags(morning.skin)}
      ${amProducts ? `<div class="products">${amProducts}</div>` : (hasData?'':'<div class="empty-hint">·</div>')}
    </div>
    <div class="rule"></div>
    <div class="half pm">
      <div class="half-label">PM</div>
      ${renderTags((night.skin||[]).concat(night.actives||[]).concat(night.care||[]))}
      ${pmProducts ? `<div class="products">${pmProducts}</div>` : (hasData?'':'<div class="empty-hint">·</div>')}
    </div>
  </div>`;
}

function renderCalendar(){
  const cal = document.getElementById('calendar');
  const days = STATE.days.days;
  let html = '';
  for(let w=0; w<3; w++){
    const weekDays = days.slice(w*7, w*7+7);
    html += `<div class="week">${weekDays.map(d=>dayCellHTML(d, STATE.data[toISODate(d)])).join('')}</div>`;
  }
  cal.innerHTML = html;

  document.getElementById('rangeLabel').textContent =
    `${toISODate(days[0])} — ${toISODate(days[20])}`;

  cal.querySelectorAll('.day').forEach(el=>{
    el.addEventListener('click', ()=>{
      const iso = el.getAttribute('data-date');
      openModal(iso, STATE.data[iso]);
    });
  });
}

function openModal(iso, entry){
  const modal = document.getElementById('modal');
  const morning = entry?.morning || {};
  const night = entry?.night || {};
  modal.innerHTML = `
    <div class="modal-head">
      <div>
        <div class="modal-date">${iso}</div>
        <div class="modal-tag">${entry ? 'RECORDED' : 'NO RECORD'}</div>
      </div>
      <button class="close-x" id="closeX">✕</button>
    </div>
    <div class="modal-section">
      <div class="modal-section-title">Morning</div>
      <div class="modal-row"><b>피부 상태</b>${(morning.skin||[]).join(', ') || '—'}</div>
      <div class="modal-row"><b>사용 제품</b>${(morning.products||[]).join(', ') || '—'}</div>
      <div class="modal-row"><b>메모</b>${morning.memo || '—'}</div>
    </div>
    <div class="modal-section pm">
      <div class="modal-section-title">Night</div>
      <div class="modal-row"><b>피부 상태</b>${(night.skin||[]).join(', ') || '—'}</div>
      <div class="modal-row"><b>사용 제품</b>${(night.products||[]).join(', ') || '—'}</div>
      <div class="modal-row"><b>액티브 / 관리</b>${(night.actives||[]).concat(night.care||[]).join(', ') || '—'}</div>
      <div class="modal-row"><b>메모</b>${night.memo || '—'}</div>
    </div>
  `;
  document.getElementById('modalBackdrop').classList.add('open');
  document.getElementById('closeX').addEventListener('click', closeModal);
}
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('open'); }
document.getElementById('modalBackdrop').addEventListener('click', (e)=>{
  if(e.target.id==='modalBackdrop') closeModal();
});

async function fetchData(){
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  setStatus('불러오는 중…');
  try{
    const r = await fetch('https://skincare-widget-chi.vercel.app/api/skincare');
    const json = await r.json();
    if(!r.ok) throw new Error(json.error || ('HTTP ' + r.status));
    const map = {};
    (json.data||[]).forEach(e => { if(e && e.date) map[e.date] = e; });
    STATE.data = map;
    renderCalendar();
    setStatus(`SYNCED ${new Date().toLocaleTimeString('ko-KR')}`);
  }catch(err){
    console.error(err);
    setStatus('불러오기 실패: ' + (err.message||''), true);
  }finally{
    btn.disabled = false;
  }
}

function init(){
  STATE.days = buildRange();
  renderWeekdayRow();
  renderCalendar();
  document.getElementById('refreshBtn').addEventListener('click', fetchData);
  fetchData();
}
init();
</script>
</body>
</html>
